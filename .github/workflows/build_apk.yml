name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      # 雲端自動補齊 android/ 等原生平台資料夾，無需本機執行 flutter create
      - run: flutter create . --platforms=android
      # 寫入自訂的 AndroidManifest.xml (覆蓋 flutter create 產生的預設檔)
      - run: cp custom_AndroidManifest.xml android/app/src/main/AndroidManifest.xml
      # 將 minSdk 調整為 24 以相容圖片壓縮與分享套件
      - run: |
          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' android/app/build.gradle
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle
          elif [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' android/app/build.gradle.kts
          fi
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
