name: Build Signed Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - run: flutter create . --platforms=android --org io.github.sohot
      - run: cp custom_AndroidManifest.xml android/app/src/main/AndroidManifest.xml
      - name: Decode Keystore and Print SHA-1
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          ALIAS="${KEY_ALIAS:-upload}"
          KPASS="${KEY_PASSWORD:-123456}"
          SPASS="${STORE_PASSWORD:-123456}"
          CLEAN_B64=$(echo "$KEYSTORE_BASE64" | grep -v 'CERTIFICATE' | tr -d '[:space:]')
          if [ -n "$CLEAN_B64" ]; then
            echo "$CLEAN_B64" | base64 -d > android/app/upload-keystore.jks
          fi
          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n" "$SPASS" "$KPASS" "$ALIAS" > android/key.properties
          APK_SHA1=$(keytool -J-Duser.language=en -list -v -keystore android/app/upload-keystore.jks -alias "$ALIAS" -storepass "$SPASS" | grep -i 'SHA1:' | awk '{print $2}')
          echo "### 🔑 本支 APK 實際簽署的 SHA-1 指紋" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "$APK_SHA1" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
      - run: python3 patch_gradle.py
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Build Release APK and AAB with Auto-Incremented Build Number
        run: |
          flutter build apk --release --build-number=${{ github.run_number }}
          flutter build appbundle --release --build-number=${{ github.run_number }}
      - name: Extract Version and Rename Outputs
        run: |
          APP_VER=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "APP_VER=$APP_VER" >> $GITHUB_ENV
          cp build/app/outputs/flutter-apk/app-release.apk "MyTuckii_v${APP_VER}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "MyTuckii_v${APP_VER}.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: MyTuckii_v${{ env.APP_VER }}
          path: |
            MyTuckii_v${{ env.APP_VER }}.apk
            MyTuckii_v${{ env.APP_VER }}.aab
      - name: Create Permanent GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VER }}
          name: 隨手存 v${{ env.APP_VER }}
          body: |
            自動編譯發布版本 **v${{ env.APP_VER }}**（Build #${{ github.run_number }}）
            - 直接下載下方 `.apk` 即可在 Android 手機覆蓋安裝更新（免移除舊版）。
            - `.aab` 檔案供上傳 Google Play 商店使用。
          files: |
            MyTuckii_v${{ env.APP_VER }}.apk
            MyTuckii_v${{ env.APP_VER }}.aab