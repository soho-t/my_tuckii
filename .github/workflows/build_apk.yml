name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - run: flutter create . --platforms=android
      - run: cp custom_AndroidManifest.xml android/app/src/main/AndroidManifest.xml
      - run: |
          python3 -c 'import re, glob
for f in glob.glob("android/settings.gradle*"):
    s = open(f).read()
    s = re.sub(r"(id\s+[\x22\x27]org\.jetbrains\.kotlin\.android[\x22\x27]\s+version\s+[\x22\x27])[^\x22\x27]+", r"\g<1>2.1.0", s)
    open(f, "w").write(s)
for f in glob.glob("android/app/build.gradle*"):
    s = open(f).read()
    s = re.sub(r"minSdk\s*=\s*flutter\.minSdkVersion", "minSdk = 24", s)
    s = re.sub(r"minSdkVersion\s+flutter\.minSdkVersion", "minSdkVersion 24", s)
    open(f, "w").write(s)
'
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
