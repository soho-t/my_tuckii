name: Build Signed Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - run: flutter create . --platforms=android --org io.github.sohot
      - run: cp custom_AndroidManifest.xml android/app/src/main/AndroidManifest.xml
      - name: Decode Keystore and Create key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -di > android/app/upload-keystore.jks
          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n" "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
      - run: python3 patch_gradle.py
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --release
      - name: Extract Version and Rename APK
        run: |
          APP_VER=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "APP_VER=$APP_VER" >> $GITHUB_ENV
          cp build/app/outputs/flutter-apk/app-release.apk "隨手存_v${APP_VER}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: 隨手存_v${{ env.APP_VER }}
          path: 隨手存_v${{ env.APP_VER }}.apk