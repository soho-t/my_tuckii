name: my_tuckii
description: 個人專屬離線書籤、截圖、文件與筆記管理工具
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  receive_sharing_intent: ^1.8.0
  flutter_image_compress: ^2.3.0
  metadata_fetch: ^0.4.2
  flutter_card_swiper: ^7.0.1
  url_launcher: ^6.3.0
  open_filex: ^4.5.0
  archive: ^3.6.1
  share_plus: ^10.0.2
  file_picker: ^8.1.2
  html: ^0.15.4
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.20.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
