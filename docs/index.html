<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>隨手存 MyTuckii · 電腦網頁伴侶版</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --bg: #FAF7F2;
      --card: #FFFFFF;
      --border: #E6DEC8;
      --primary: #8C6239;
      --primary-dark: #5A4328;
      --text: #2C2520;
      --muted: #786B5E;
      --danger: #C62828;
      --chip-bg: #EFE9DC;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Microsoft JhengHei", "PingFang TC", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(250, 247, 242, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 700;
      color: var(--primary-dark);
    }
    .brand span.badge {
      font-size: 12px;
      background: var(--chip-bg);
      color: var(--primary);
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    button {
      font-family: inherit;
      cursor: pointer;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      padding: 8px 14px;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.15s ease;
    }
    button:hover { border-color: var(--primary); }
    button.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    button.primary:hover { background: var(--primary-dark); }
    button.danger {
      color: var(--danger);
      border-color: #F2B8B5;
      background: #FFF5F5;
    }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 24px 20px 64px;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 20px;
    }
    .setup-box {
      max-width: 520px;
      margin: 48px auto;
    }
    .setup-box h2 { margin-top: 0; color: var(--primary-dark); }
    details.advanced-box {
      margin-top: 18px;
      border-top: 1px solid #F2ECE0;
      padding-top: 12px;
      font-size: 13px;
      color: var(--muted);
    }
    details.advanced-box summary {
      cursor: pointer;
      user-select: none;
      margin-bottom: 10px;
    }
    input[type="text"], input[type="url"], textarea, select {
      width: 100%;
      font-family: inherit;
      font-size: 14px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      outline: none;
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--primary);
    }
    .file-drop-box {
      border: 1.5px dashed var(--border);
      border-radius: 12px;
      padding: 12px;
      background: #FCF9F4;
      text-align: center;
      margin-bottom: 12px;
    }
    .file-drop-box input[type="file"] { display: none; }
    .file-info {
      font-size: 12px;
      color: var(--primary-dark);
      margin-top: 6px;
      word-break: break-all;
    }
    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .toolbar input { flex: 1; min-width: 240px; }
    .inline-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .inline-row select { flex: 1; }
    .inline-row button { white-space: nowrap; padding: 10px 12px; }
    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .chip {
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--chip-bg);
      color: var(--primary-dark);
      font-size: 13px;
      border: 1px solid transparent;
      cursor: pointer;
    }
    .chip.active {
      background: var(--primary);
      color: #fff;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(90, 67, 40, 0.08);
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
    }
    .card-title {
      font-size: 15px;
      font-weight: 700;
      margin: 4px 0;
      word-break: break-word;
    }
    .card-title a {
      color: var(--text);
      text-decoration: none;
    }
    .card-title a:hover { color: var(--primary); text-decoration: underline; }
    .card-note {
      font-size: 13px;
      color: var(--muted);
      white-space: pre-wrap;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-tags {
      font-size: 12px;
      color: var(--primary);
      font-weight: 600;
    }
    .card-actions {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      flex-wrap: wrap;
      border-top: 1px solid #F2ECE0;
      padding-top: 8px;
    }
    .card-actions button {
      padding: 4px 10px;
      font-size: 12px;
    }
    .status-bar {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .hidden { display: none !important; }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(44, 37, 32, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 16px;
    }
    .modal {
      background: var(--card);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 92vh;
      overflow-y: auto;
      padding: 22px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.2);
    }
    .modal h3 { margin-top: 0; color: var(--primary-dark); }
    .form-group { margin-bottom: 12px; }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--primary-dark);
    }
    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--primary-dark);
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 14px;
      z-index: 100;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      🗂️ 隨手存 MyTuckii <span class="badge">Web 伴侶版 v1.9.3</span>
    </div>
    <div class="header-actions" id="headerActions">
      <button id="btnAdd" class="primary hidden" onclick="openEditor()">＋ 新增收藏</button>
      <button id="btnSync" class="hidden" onclick="syncFromDrive()">🔄 重新同步</button>
      <button id="btnInspect" class="hidden" onclick="inspectRawFile()">🔍 檢視同步檔</button>
      <button id="btnSignOut" class="hidden" onclick="signOut()">登出</button>
    </div>
  </header>

  <main>
    <section id="authSection" class="panel setup-box">
      <h2>連線你的 Google Drive 收藏庫</h2>
      <p style="color: var(--muted); font-size: 14px;">
        登入與手機《隨手存》相同的 Google 帳號，即可直接讀取並同步你個人雲端硬碟隱藏資料夾（<code>appDataFolder</code>）中的收藏與檔案，資料完全獨立、不經過任何第三方伺服器。
      </p>

      <div style="margin-top: 20px;">
        <button class="primary" style="width: 100%; padding: 12px; font-size: 15px;" onclick="startGoogleLogin()">
          使用 Google 帳號登入並同步
        </button>
      </div>

      <details id="advancedClientBox" class="advanced-box">
        <summary>進階設定：更換自訂 Google Client ID</summary>
        <div class="form-group">
          <label for="clientIdInput">Google Web OAuth Client ID</label>
          <input id="clientIdInput" type="text" placeholder="貼上 xxxx.apps.googleusercontent.com" />
        </div>
        <p style="font-size: 12px; margin: 4px 0 0;">
          一般使用者直接點擊上方登入按鈕即可，無須修改此欄位。
        </p>
      </details>
    </section>

    <section id="appSection" class="hidden">
      <div class="status-bar">
        <span id="statusText">已連線 Google Drive</span>
        <span id="fileInfoText"></span>
      </div>

      <div class="toolbar">
        <input id="searchInput" type="text" placeholder="搜尋標題、備註、標籤或網址..." oninput="renderItems()" />
        <select id="collectionFilter" style="width: auto; min-width: 150px;" onchange="renderItems()">
          <option value="all">所有資料夾</option>
          <option value="none">未分類</option>
        </select>
        <button type="button" onclick="createNewCollection('filter')">📁＋ 新增收藏夾</button>
      </div>

      <div class="chips" id="typeChips">
        <button class="chip active" data-type="all" onclick="setTypeFilter('all')">全部類型</button>
        <button class="chip" data-type="unread" onclick="setTypeFilter('unread')">未讀項目</button>
        <button class="chip" data-type="file" onclick="setTypeFilter('file')">本機文件</button>
        <button class="chip" data-type="image" onclick="setTypeFilter('image')">螢幕截圖</button>
        <button class="chip" data-type="link" onclick="setTypeFilter('link')">網頁連結</button>
        <button class="chip" data-type="note" onclick="setTypeFilter('note')">文字筆記</button>
      </div>

      <div id="itemsGrid" class="grid"></div>
    </section>
  </main>

  <div id="editorModal" class="modal-backdrop hidden">
    <div class="modal">
      <h3 id="editorTitle">新增收藏</h3>
      <input type="hidden" id="editIndex" value="-1" />

      <div id="fileDropBox" class="file-drop-box">
        <input id="fieldFile" type="file" onchange="onFileSelected(event)" />
        <button type="button" onclick="document.getElementById('fieldFile').click()" style="width: 100%;">
          📎 選取電腦檔案（PDF / Word / Excel / 圖片 / 任意格式）
        </button>
        <div id="selectedFileInfo" class="file-info"></div>
      </div>

      <div class="form-group">
        <label for="fieldType">類型</label>
        <select id="fieldType" onchange="onTypeChanged()">
          <option value="link">網頁連結</option>
          <option value="note">文字筆記</option>
          <option value="file">電腦檔案 / 文件</option>
          <option value="image">圖片 / 截圖</option>
        </select>
      </div>
      <div class="form-group">
        <label for="fieldTitle">標題 / 檔名</label>
        <input id="fieldTitle" type="text" placeholder="輸入名稱或標題（選檔後自動帶入檔名）" />
      </div>
      <div class="form-group" id="urlGroup">
        <label for="fieldUrl">網址（檔案或文字筆記可留空）</label>
        <input id="fieldUrl" type="url" placeholder="https://..." />
      </div>
      <div class="form-group">
        <label for="fieldTags">標籤（以逗號分隔）</label>
        <input id="fieldTags" type="text" placeholder="例如：合約, 報表, 美食" />
      </div>
      <div class="form-group">
        <label for="fieldCollection">收藏夾</label>
        <div class="inline-row">
          <select id="fieldCollection">
            <option value="">未分類</option>
          </select>
          <button type="button" onclick="createNewCollection('editor')">＋ 新增</button>
        </div>
      </div>
      <div class="form-group">
        <label for="fieldNote">備註／筆記內文</label>
        <textarea id="fieldNote" rows="4" placeholder="輸入重點摘要或筆記內容"></textarea>
      </div>
      <div class="modal-footer">
        <button onclick="closeEditor()">取消</button>
        <button class="primary" id="btnSaveItem" onclick="saveItem()">儲存並同步至雲端</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script>
    const DEFAULT_CLIENT_ID = '426482376122-sccskkkiak02aqve07fseh73poffhpj1.apps.googleusercontent.com';
    const SYNC_INDEX_NAME = 'sync_index.json';
    const SCOPE = 'https://www.googleapis.com/auth/drive.appdata';
    const CLIENT_ID_KEY = 'mytuckii_web_client_id';

    let accessToken = null;
    let tokenClient = null;
    let syncFileId = null;
    let rawPayload = { version: 1, syncedAt: new Date().toISOString(), collections: [], items: [] };
    let currentTypeFilter = 'all';

    let driveFilesByName = {};
    let selectedFile = null;

    window.addEventListener('DOMContentLoaded', () => {
      const savedId = localStorage.getItem(CLIENT_ID_KEY) || '';
      const activeId = savedId || DEFAULT_CLIENT_ID;
      document.getElementById('clientIdInput').value = activeId;
    });

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(el._timer);
      el._timer = setTimeout(() => el.classList.add('hidden'), 3000);
    }

    function startGoogleLogin() {
      try {
        const inputId = document.getElementById('clientIdInput').value.trim();
        const clientId = inputId || DEFAULT_CLIENT_ID;

        if (!clientId) {
          document.getElementById('advancedClientBox').open = true;
          alert('尚未設定 Google Web OAuth Client ID，請先在進階設定中填入。');
          return;
        }

        if (inputId && inputId !== DEFAULT_CLIENT_ID) {
          localStorage.setItem(CLIENT_ID_KEY, inputId);
        }

        if (!window.google || !google.accounts || !google.accounts.oauth2) {
          alert('Google 登入元件尚未載入完成，請檢查瀏覽器追蹤保護設定並稍候重試。');
          return;
        }

        tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: clientId,
          scope: SCOPE,
          callback: async (resp) => {
            if (resp.error) {
              alert('Google 授權失敗：' + resp.error);
              return;
            }
            accessToken = resp.access_token;
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('appSection').classList.remove('hidden');
            ['btnAdd', 'btnSync', 'btnInspect', 'btnSignOut'].forEach(id =>
              document.getElementById(id).classList.remove('hidden')
            );
            await syncFromDrive();
          },
          error_callback: (err) => {
            alert('無法開啟 Google 登入視窗：' + (err.message || err.type || JSON.stringify(err)) + '\n\n請允許瀏覽器開啟此網站的彈出型視窗。');
          }
        });

        tokenClient.requestAccessToken({ prompt: 'select_account' });
      } catch (e) {
        alert('啟動 Google 登入時發生錯誤：' + e.message);
      }
    }

    function signOut() {
      accessToken = null;
      syncFileId = null;
      rawPayload = { version: 1, syncedAt: new Date().toISOString(), collections: [], items: [] };
      driveFilesByName = {};
      document.getElementById('authSection').classList.remove('hidden');
      document.getElementById('appSection').classList.add('hidden');
      ['btnAdd', 'btnSync', 'btnInspect', 'btnSignOut'].forEach(id =>
        document.getElementById(id).classList.add('hidden')
      );
      showToast('已登出');
    }

    async function driveFetch(url, options = {}) {
      const res = await fetch(url, {
        ...options,
        headers: {
          Authorization: `Bearer ${accessToken}`,
          ...(options.headers || {})
        }
      });
      if (res.status === 401) {
        showToast('登入憑證已過期，請重新登入');
        signOut();
        throw new Error('Unauthorized');
      }
      if (!res.ok) {
        const text = await res.text();
        throw new Error(`Drive API 錯誤 (${res.status}): ${text}`);
      }
      return res;
    }

    function toIsoString(val) {
      if (!val) return new Date().toISOString();
      if (typeof val === 'string') {
        const d = new Date(val);
        return isNaN(d.getTime()) ? new Date().toISOString() : d.toISOString();
      }
      if (typeof val === 'number') {
        return new Date(val).toISOString();
      }
      return new Date().toISOString();
    }

    function migrateAndRepairPayload(data) {
      let repaired = false;
      if (!data || typeof data !== 'object') {
        data = { version: 1, syncedAt: new Date().toISOString(), collections: [], items: [] };
        repaired = true;
      }

      if (!Array.isArray(data.collections)) {
        data.collections = [];
        repaired = true;
      }

      if (!Array.isArray(data.items)) {
        if (Array.isArray(data.savedItems)) {
          data.items = data.savedItems;
          delete data.savedItems;
          repaired = true;
        } else {
          data.items = [];
          repaired = true;
        }
      }

      data.collections = data.collections.map(c => {
        const syncUuid = c.syncUuid || c.uuid || crypto.randomUUID();
        const createdAt = toIsoString(c.createdAt || c.created_at);
        const updatedAt = toIsoString(c.updatedAt || c.updated_at || createdAt);
        if (!c.syncUuid || typeof c.createdAt !== 'string' || typeof c.updatedAt !== 'string') {
          repaired = true;
        }
        return {
          syncUuid,
          name: c.name || '未命名資料夾',
          iconName: c.iconName || c.icon_name || 'folder',
          createdAt,
          updatedAt,
          isDeleted: Boolean(c.isDeleted ?? c.is_deleted ?? false)
        };
      });

      data.items = data.items.map(i => {
        const syncUuid = i.syncUuid || i.uuid || crypto.randomUUID();
        const rawMedia = i.mediaFileName || i.localImagePath || i.local_image_path || null;
        const mediaFileName = rawMedia ? String(rawMedia).split(/[\\/]/).pop() : null;
        const createdAt = toIsoString(i.createdAt || i.created_at);
        const updatedAt = toIsoString(i.updatedAt || i.updated_at || createdAt);
        const itemType = i.itemType || i.item_type || 'link';
        const collectionUuid = i.collectionUuid ?? i.collection_uuid ?? null;

        if (
          !i.syncUuid ||
          'uuid' in i ||
          'localImagePath' in i ||
          'local_image_path' in i ||
          'driveFileId' in i ||
          typeof i.createdAt !== 'string' ||
          typeof i.updatedAt !== 'string'
        ) {
          repaired = true;
        }

        return {
          syncUuid,
          collectionUuid: collectionUuid ? String(collectionUuid) : null,
          itemType,
          url: i.url || null,
          title: i.title || i.url || '未命名項目',
          note: i.note || null,
          tags: i.tags || null,
          mediaFileName,
          isRead: Boolean(i.isRead ?? i.is_read ?? false),
          isPinned: Boolean(i.isPinned ?? i.is_pinned ?? false),
          isDeleted: Boolean(i.isDeleted ?? i.is_deleted ?? false),
          createdAt,
          updatedAt
        };
      });

      data.version = 1;
      return { payload: data, repaired };
    }

    async function syncFromDrive() {
      document.getElementById('statusText').textContent = '正在連線 Google Drive 讀取收藏庫...';
      try {
        const listRes = await driveFetch(
          'https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id,name,mimeType,modifiedTime,size)&pageSize=1000'
        );
        const listData = await listRes.json();
        const files = listData.files || [];

        driveFilesByName = {};
        files.forEach(f => {
          if (f.name) driveFilesByName[f.name] = f;
        });

        const legacyFile = driveFilesByName['mytuckii_sync.json'];
        const indexFile = driveFilesByName[SYNC_INDEX_NAME];

        if (!indexFile && !legacyFile) {
          syncFileId = null;
          rawPayload = { version: 1, syncedAt: new Date().toISOString(), collections: [], items: [] };
          document.getElementById('statusText').textContent = '雲端尚無同步檔（新增項目後將自動建立）';
          document.getElementById('fileInfoText').textContent = `appDataFolder 共 ${files.length} 個檔案`;
          populateCollections();
          renderItems();
          return;
        }

        const targetFile = indexFile || legacyFile;
        const contentRes = await driveFetch(
          `https://www.googleapis.com/drive/v3/files/${targetFile.id}?alt=media`
        );
        const fetchedJson = await contentRes.json();
        const { payload, repaired } = migrateAndRepairPayload(fetchedJson);
        rawPayload = payload;
        syncFileId = indexFile ? indexFile.id : null;

        if (repaired || !indexFile) {
          await uploadToDrive();
          if (legacyFile && legacyFile.id) {
            try {
              await driveFetch(`https://www.googleapis.com/drive/v3/files/${legacyFile.id}`, { method: 'DELETE' });
            } catch (_) {}
          }
        }

        const modTime = targetFile.modifiedTime ? new Date(targetFile.modifiedTime).toLocaleString() : '';
        const attachmentCount = Object.keys(driveFilesByName).filter(n => !n.endsWith('.json')).length;
        document.getElementById('statusText').textContent = `同步完成（${new Date().toLocaleTimeString()}）`;
        document.getElementById('fileInfoText').textContent =
          `索引：${SYNC_INDEX_NAME} · 雲端附件 ${attachmentCount} 個 · 更新：${modTime}`;
        populateCollections();
        renderItems();
        showToast(repaired ? '已自動修復同步格式並完成更新！' : '已同步最新收藏資料');
      } catch (err) {
        document.getElementById('statusText').textContent = '同步失敗：' + err.message;
        console.error(err);
      }
    }

    function populateCollections() {
      const cols = (rawPayload.collections || []).filter(c => !c.isDeleted);
      const filterEl = document.getElementById('collectionFilter');
      const fieldEl = document.getElementById('fieldCollection');
      const prevFilter = filterEl.value;
      const prevField = fieldEl.value;

      filterEl.innerHTML = '<option value="all">所有資料夾</option><option value="none">未分類</option>';
      fieldEl.innerHTML = '<option value="">未分類</option>';

      cols.forEach(c => {
        const opt1 = document.createElement('option');
        opt1.value = c.syncUuid;
        opt1.textContent = c.name || '未命名資料夾';
        filterEl.appendChild(opt1);

        const opt2 = opt1.cloneNode(true);
        fieldEl.appendChild(opt2);
      });

      if ([...filterEl.options].some(o => o.value === prevFilter)) {
        filterEl.value = prevFilter;
      }
      if ([...fieldEl.options].some(o => o.value === prevField)) {
        fieldEl.value = prevField;
      }
    }

    async function createNewCollection(source) {
      const name = prompt('請輸入新收藏夾名稱（例如：工作文件、旅遊靈感）：');
      if (!name) return;
      const trimmed = name.trim();
      if (!trimmed) return;

      const existing = (rawPayload.collections || []).find(
        c => !c.isDeleted && (c.name || '').trim() === trimmed
      );

      if (existing) {
        populateCollections();
        if (source === 'editor') {
          document.getElementById('fieldCollection').value = existing.syncUuid;
        } else {
          document.getElementById('collectionFilter').value = existing.syncUuid;
          renderItems();
        }
        showToast(`已選取現有收藏夾「${existing.name}」`);
        return;
      }

      const now = new Date().toISOString();
      const newUuid = crypto.randomUUID();
      rawPayload.collections.push({
        syncUuid: newUuid,
        name: trimmed,
        iconName: 'folder',
        createdAt: now,
        updatedAt: now,
        isDeleted: false
      });

      populateCollections();
      if (source === 'editor') {
        document.getElementById('fieldCollection').value = newUuid;
      } else {
        document.getElementById('collectionFilter').value = newUuid;
        renderItems();
      }

      try {
        await uploadToDrive();
        showToast(`已建立收藏夾「${trimmed}」並同步至雲端`);
      } catch (err) {
        alert('建立收藏夾同步失敗：' + err.message);
      }
    }

    function setTypeFilter(type) {
      currentTypeFilter = type;
      document.querySelectorAll('#typeChips .chip').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.type === type);
      });
      renderItems();
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatBytes(bytes) {
      const n = Number(bytes);
      if (!n) return '';
      if (n < 1024) return `${n} B`;
      if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KB`;
      return `${(n / (1024 * 1024)).toFixed(2)} MB`;
    }

    function renderItems() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      const colFilter = document.getElementById('collectionFilter').value;
      const rawList = rawPayload.items || [];

      const items = rawList
        .map((raw, index) => ({
          index,
          raw,
          driveFile: raw.mediaFileName ? driveFilesByName[raw.mediaFileName] : null
        }))
        .filter(({ raw }) => !raw.isDeleted)
        .filter(({ raw }) => {
          if (currentTypeFilter === 'unread') return !raw.isRead;
          if (currentTypeFilter !== 'all') return raw.itemType === currentTypeFilter;
          return true;
        })
        .filter(({ raw }) => {
          if (colFilter === 'all') return true;
          if (colFilter === 'none') return !raw.collectionUuid;
          return raw.collectionUuid === colFilter;
        })
        .filter(({ raw }) => {
          if (!q) return true;
          return (
            (raw.title || '').toLowerCase().includes(q) ||
            (raw.url || '').toLowerCase().includes(q) ||
            (raw.note || '').toLowerCase().includes(q) ||
            (raw.tags || '').toLowerCase().includes(q)
          );
        })
        .sort((a, b) => {
          if (a.raw.isPinned !== b.raw.isPinned) return a.raw.isPinned ? -1 : 1;
          return new Date(b.raw.createdAt || 0).getTime() - new Date(a.raw.createdAt || 0).getTime();
        });

      const grid = document.getElementById('itemsGrid');
      if (items.length === 0) {
        grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--muted);padding:48px 0;">目前沒有符合條件的收藏項目</div>';
        return;
      }

      const typeLabel = { link: '🔗 連結', note: '📝 筆記', image: '🖼️ 截圖', file: '📄 文件' };

      grid.innerHTML = items.map(({ index, raw, driveFile }) => `
        <article class="card">
          <div>
            <div class="card-top">
              <span>${typeLabel[raw.itemType] || raw.itemType}${raw.isPinned ? ' · 📌' : ''}${!raw.isRead ? ' · 🔵 未讀' : ''}</span>
              ${driveFile && driveFile.size ? `<span>${formatBytes(driveFile.size)}</span>` : ''}
            </div>
            <div class="card-title">
              ${raw.url
                ? `<a href="${escapeHtml(raw.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(raw.title)}</a>`
                : escapeHtml(raw.title)}
            </div>
            ${raw.note ? `<div class="card-note">${escapeHtml(raw.note)}</div>` : ''}
            ${raw.tags ? `<div class="card-tags">#${escapeHtml(raw.tags)}</div>` : ''}
          </div>
          <div class="card-actions">
            ${driveFile ? `<button onclick="downloadDriveFile('${escapeHtml(driveFile.id)}', '${escapeHtml(raw.title).replace(/'/g, "\\'")}', '${escapeHtml(driveFile.mimeType || '')}')">開啟／下載</button>` : ''}
            ${raw.url ? `<button onclick="copyText('${escapeHtml(raw.url).replace(/'/g, "\\'")}')">複製網址</button>` : ''}
            <button onclick="openEditor(${index})">編輯</button>
            <button class="danger" onclick="softDeleteItem(${index})">刪除</button>
          </div>
        </article>
      `).join('');
    }

    async function downloadDriveFile(fileId, fileName, mimeType) {
      showToast('正在從 Google Drive 讀取檔案...');
      try {
        const res = await driveFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
        const blob = await res.blob();
        const blobUrl = URL.createObjectURL(blob);

        if (mimeType.startsWith('image/') || mimeType === 'application/pdf') {
          window.open(blobUrl, '_blank', 'noopener,noreferrer');
        } else {
          const a = document.createElement('a');
          a.href = blobUrl;
          a.download = fileName || 'download';
          document.body.appendChild(a);
          a.click();
          a.remove();
        }
        setTimeout(() => URL.revokeObjectURL(blobUrl), 60000);
      } catch (err) {
        alert('讀取檔案失敗：' + err.message);
      }
    }

    function copyText(text) {
      navigator.clipboard.writeText(text).then(() => showToast('已複製到剪貼簿'));
    }

    function onFileSelected(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      selectedFile = file;

      const isImg = file.type && file.type.startsWith('image/');
      document.getElementById('fieldType').value = isImg ? 'image' : 'file';
      onTypeChanged();

      const titleEl = document.getElementById('fieldTitle');
      if (!titleEl.value.trim()) {
        titleEl.value = file.name;
      }

      const tagsEl = document.getElementById('fieldTags');
      if (!tagsEl.value.trim()) {
        const extMatch = file.name.match(/\.([a-zA-Z0-9]+)$/);
        if (extMatch) {
          tagsEl.value = extMatch[1].toUpperCase();
        }
      }

      document.getElementById('selectedFileInfo').textContent =
        `已選取：${file.name}（${formatBytes(file.size)}）`;
    }

    function onTypeChanged() {
      const type = document.getElementById('fieldType').value;
      const urlGroup = document.getElementById('urlGroup');
      urlGroup.classList.toggle('hidden', type === 'file' || type === 'image');
    }

    function openEditor(index = -1) {
      selectedFile = null;
      document.getElementById('fieldFile').value = '';
      document.getElementById('selectedFileInfo').textContent = '';
      document.getElementById('editIndex').value = String(index);

      const currentFilterCol = document.getElementById('collectionFilter').value;

      if (index === -1) {
        document.getElementById('editorTitle').textContent = '新增收藏';
        document.getElementById('fileDropBox').classList.remove('hidden');
        document.getElementById('fieldType').value = 'link';
        document.getElementById('fieldTitle').value = '';
        document.getElementById('fieldUrl').value = '';
        document.getElementById('fieldTags').value = '';
        document.getElementById('fieldCollection').value =
          (currentFilterCol !== 'all' && currentFilterCol !== 'none') ? currentFilterCol : '';
        document.getElementById('fieldNote').value = '';
      } else {
        const raw = rawPayload.items[index];
        document.getElementById('editorTitle').textContent = '編輯收藏';
        document.getElementById('fileDropBox').classList.add('hidden');
        document.getElementById('fieldType').value = raw.itemType || 'link';
        document.getElementById('fieldTitle').value = raw.title || '';
        document.getElementById('fieldUrl').value = raw.url || '';
        document.getElementById('fieldTags').value = raw.tags || '';
        document.getElementById('fieldCollection').value = raw.collectionUuid || '';
        document.getElementById('fieldNote').value = raw.note || '';
      }
      onTypeChanged();
      document.getElementById('editorModal').classList.remove('hidden');
    }

    function closeEditor() {
      document.getElementById('editorModal').classList.add('hidden');
    }

    async function uploadBinaryToDrive(file, savedName) {
      const boundary = 'mytuckii_bin_' + Date.now();
      const metadata = JSON.stringify({
        name: savedName,
        parents: ['appDataFolder']
      });
      const mime = file.type || 'application/octet-stream';
      const header =
        `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${metadata}\r\n` +
        `--${boundary}\r\nContent-Type: ${mime}\r\n\r\n`;
      const footer = `\r\n--${boundary}--`;
      const bodyBlob = new Blob([header, file, footer], {
        type: `multipart/related; boundary=${boundary}`
      });

      const res = await driveFetch(
        'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,mimeType,size',
        {
          method: 'POST',
          headers: { 'Content-Type': `multipart/related; boundary=${boundary}` },
          body: bodyBlob
        }
      );
      return await res.json();
    }

    async function saveItem() {
      const idx = parseInt(document.getElementById('editIndex').value, 10);
      const type = document.getElementById('fieldType').value;
      const url = document.getElementById('fieldUrl').value.trim();
      const note = document.getElementById('fieldNote').value.trim();
      let title = document.getElementById('fieldTitle').value.trim();
      const tags = document.getElementById('fieldTags').value.trim();
      const colUuid = document.getElementById('fieldCollection').value || null;

      if (idx === -1 && (type === 'file' || type === 'image') && !selectedFile) {
        alert('請先點選上方「選取電腦檔案」選擇要上傳的檔案或圖片。');
        return;
      }

      if (!title) {
        title = (selectedFile && selectedFile.name) || url || (note.length > 20 ? note.slice(0, 20) + '...' : note) || '未命名項目';
      }

      const btn = document.getElementById('btnSaveItem');
      btn.disabled = true;
      const originalBtnText = btn.textContent;
      btn.textContent = selectedFile ? '正在上傳檔案並同步...' : '正在同步至雲端...';

      try {
        const now = new Date().toISOString();
        let savedFileName = null;

        if (idx === -1 && selectedFile) {
          savedFileName = `${Date.now()}_${selectedFile.name}`;
          const uploadedMeta = await uploadBinaryToDrive(selectedFile, savedFileName);
          driveFilesByName[uploadedMeta.name] = uploadedMeta;
        }

        if (idx === -1) {
          const finalType = selectedFile ? type : (url ? 'link' : type);
          rawPayload.items.unshift({
            syncUuid: crypto.randomUUID(),
            collectionUuid: colUuid,
            itemType: finalType,
            url: (finalType === 'link' && url) ? url : null,
            title,
            note: note || null,
            tags: tags || null,
            mediaFileName: savedFileName,
            isRead: false,
            isPinned: false,
            isDeleted: false,
            createdAt: now,
            updatedAt: now
          });
        } else {
          const target = rawPayload.items[idx];
          target.title = title;
          if (target.itemType === 'link') {
            target.url = url || null;
          }
          target.note = note || null;
          target.tags = tags || null;
          target.collectionUuid = colUuid;
          target.updatedAt = now;
        }

        await uploadToDrive();
        closeEditor();
        renderItems();
        showToast(savedFileName ? '檔案已上傳並同步！手機點同步即可下載' : '已儲存並同步至 Google Drive');
      } catch (err) {
        alert('上傳失敗：' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = originalBtnText;
      }
    }

    async function softDeleteItem(index) {
      if (!confirm('確定要將這筆項目移至回收桶並同步到雲端嗎？')) return;
      const target = rawPayload.items[index];
      target.isDeleted = true;
      target.updatedAt = new Date().toISOString();
      try {
        await uploadToDrive();
        renderItems();
        showToast('已移至回收桶並同步');
      } catch (err) {
        alert('同步失敗：' + err.message);
      }
    }

    async function uploadToDrive() {
      rawPayload.version = 1;
      rawPayload.syncedAt = new Date().toISOString();
      const jsonStr = JSON.stringify(rawPayload);

      if (syncFileId) {
        await driveFetch(
          `https://www.googleapis.com/upload/drive/v3/files/${syncFileId}?uploadType=media`,
          {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: jsonStr
          }
        );
      } else {
        const boundary = 'mytuckii_sync_boundary';
        const metadata = JSON.stringify({
          name: SYNC_INDEX_NAME,
          parents: ['appDataFolder']
        });
        const body =
          `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${metadata}\r\n` +
          `--${boundary}\r\nContent-Type: application/json\r\n\r\n${jsonStr}\r\n--${boundary}--`;
        const res = await driveFetch(
          'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',
          {
            method: 'POST',
            headers: { 'Content-Type': `multipart/related; boundary=${boundary}` },
            body
          }
        );
        const created = await res.json();
        syncFileId = created.id;
      }
      document.getElementById('statusText').textContent = `已同步至雲端（${new Date().toLocaleTimeString()}）`;
    }

    function inspectRawFile() {
      const sample = (rawPayload.items || []).slice(0, 2);
      alert(
        `索引檔名：${SYNC_INDEX_NAME}\n` +
        `資料夾數：${(rawPayload.collections || []).filter(c => !c.isDeleted).length} 個\n` +
        `總項目數：${(rawPayload.items || []).length} 筆\n` +
        `雲端附件數：${Object.keys(driveFilesByName).filter(n => !n.endsWith('.json')).length} 個\n\n` +
        `前 2 筆範例：\n` + JSON.stringify(sample, null, 2)
      );
    }
  </script>
